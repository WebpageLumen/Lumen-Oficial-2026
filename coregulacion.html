<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Co-regulación</title>

    <link
        rel="stylesheet"
        href="coregulacion.css">
     <link rel="icon" type="image/png" href="Imagenes/Lg.png"/>
</head>


<body>


<!-- =========================
     SELECTOR DE IDIOMA
========================= -->

<div class="language-dropdown" id="languageDropdown">

    <button
        class="language-button"
        id="languageButton">

        <img
            id="banderaActual"
            class="language-flag"
            src="Imagenes/español.webp"
            alt="Español">

        <span id="codigoIdioma">ES</span>

        <span class="arrow">⌄</span>

    </button>


    <div
        class="language-menu"
        id="languageMenu">

        <button
            class="language-option"
            id="opcionES">

            <img
                class="language-flag"
                src="Imagenes/español.webp"
                alt="Español">

            <span>ES</span>

        </button>


        <button
            class="language-option"
            id="opcionEN">

            <img
                class="language-flag"
                src="Imagenes/ingles.png"
                alt="English">

            <span>EN</span>

        </button>

    </div>

</div>


     <a href="regulacionemocional-dellvasquez1929.html"
        class="btn-volver">

        ←

    </a>


    <!-- =====================================================
         SECCIÓN 1 — CO-REGULACIÓN
    ====================================================== -->

    <section class="seccion-1">

        <div class="encabezado">

            <div class="encabezado-texto">

                <h1>Co-regulación</h1>

                <p>
                    La co-regulación es cuando otra
                    persona te ayuda a sentir tranquilo
                    cuando tus emociones son muy fuertes.
                </p>

            </div>


            <!--
                AQUÍ VA LA IMAGEN DEL CORAZÓN
                QUE APARECE EN EL ENCABEZADO.

                Ejemplo:
                imagen-coregulacion.png
            -->

            <div class="imagen-encabezado">

                <img
                    src="coregulacion/coregulacion.png"
                    alt="Co-regulación">

            </div>

        </div>

    </section>



    <!-- =====================================================
         SECCIÓN 2 — TARJETAS
    ====================================================== -->

    <section class="seccion-2">


        <div class="contenido-seccion-2">


            <!-- =================================================
                 TARJETAS
            ================================================== -->

            <div class="tarjetas">


                <!-- TARJETA 1 -->

                <button
                    class="tarjeta azul"
                    data-titulo="Escuchar sin juzgar"
                    data-texto="Presta atención a lo que la persona expresa sin interrumpir ni criticar. A veces, sentirse escuchado puede ayudar a recuperar la calma."
                    data-imagen="coregulacion/1.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/1.png"
                            alt="Escuchar">

                    </div>

                    <span>
                        Escuchar sin juzgar
                    </span>

                    <strong>›</strong>

                </button>



                <!-- TARJETA 2 -->

                <button
                    class="tarjeta lila"
                    data-titulo="Dar tiempo para responder"
                    data-texto="Cada persona necesita su propio tiempo para organizar lo que siente y piensa. Evita presionar y permite que pueda responder cuando esté preparada."
                    data-imagen="coregulacion/2.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/2.png"
                            alt="Tiempo">

                    </div>

                    <span>
                        Dar tiempo para
                        responder
                    </span>

                    <strong>›</strong>

                </button>



                <!-- TARJETA 3 -->

                <button
                    class="tarjeta amarillo"
                    data-titulo="Hablar con un tono de voz tranquilo"
                    data-texto="Utiliza una voz suave y tranquila. Un tono calmado puede ayudar a que la otra persona se sienta segura y pueda regular mejor sus emociones."
                    data-imagen="coregulacion/3.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/3.png"
                            alt="Hablar">

                    </div>

                    <span>
                        Hablar con un tono
                        de voz tranquilo
                    </span>

                    <strong>›</strong>

                </button>



                <!-- TARJETA 4 -->

                <button
                    class="tarjeta azul"
                    data-titulo="Acompañar a un lugar tranquilo"
                    data-texto="Si el entorno resulta abrumador, puedes acompañar a la persona a un lugar con menos ruido, personas o estímulos."
                    data-imagen="coregulacion/4.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/4.png"
                            alt="Lugar tranquilo">

                    </div>

                    <span>
                        Acompañar a un
                        lugar tranquilo
                    </span>

                    <strong>›</strong>

                </button>



                <!-- TARJETA 5 -->

                <button
                    class="tarjeta azul"
                    data-titulo="Hacer preguntas sencillas"
                    data-texto="Haz preguntas cortas y fáciles de responder. Esto puede ayudar a la persona a expresar lo que necesita sin sentirse presionada."
                    data-imagen="coregulacion/5.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/5.png"
                            alt="Preguntas">

                    </div>

                    <span>
                        Hacer preguntas
                        sencillas
                    </span>

                    <strong>›</strong>

                </button>



                <!-- TARJETA 6 -->

                <button
                    class="tarjeta lila"
                    data-titulo="Validar la emoción"
                    data-texto="Reconoce lo que la persona está sintiendo sin minimizarlo. Puedes demostrarle que entiendes que esa emoción es importante para ella."
                    data-imagen="coregulacion/6.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/6.png"
                            alt="Validar emoción">

                    </div>

                    <span>
                        Validar la emoción
                    </span>

                    <strong>›</strong>

                </button>



                <!-- TARJETA 7 -->

                <button
                    class="tarjeta amarillo"
                    data-titulo="Recordar estrategias que ya funcionan"
                    data-texto="Recuerda aquellas estrategias que anteriormente le han ayudado a sentirse tranquila. Utilizar algo que ya conoce puede darle seguridad."
                    data-imagen="coregulacion/7.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/7.png"
                            alt="Estrategias">

                    </div>

                    <span>
                        Recordar estrategias
                        que ya funcionan
                    </span>

                    <strong>›</strong>

                </button>



                <!-- TARJETA 8 -->

                <button
                    class="tarjeta azul especial"
                    data-titulo="Tu presencia hace la diferencia"
                    data-texto="Estar ahí, con paciencia y cariño, es un apoyo poderoso. No se trata de tener todas las respuestas, sino de caminar juntos."
                    data-imagen="coregulacion/8.2.png">

                    <div class="icono">

                        <img
                            src="coregulacion/8.png"
                            alt="Familia">

                    </div>

                    <span>
                        Tu presencia hace
                        la diferencia
                    </span>

                    <strong>›</strong>

                </button>

            </div>



            <!-- =================================================
                 MODAL
            ================================================== -->

            <aside
                class="modal"
                id="modal">


                <button
                    class="cerrar"
                    id="cerrarModal"
                    aria-label="Cerrar">

                    ×

                </button>


                <div class="modal-imagen">

                    <img
                        id="modalImagen"
                        src=""
                        alt="">

                </div>


                <h2 id="modalTitulo">
                    Escuchar sin juzgar
                </h2>


                <p id="modalTexto">
                    Selecciona una tarjeta para
                    conocer más.
                </p>


                <button
                    class="boton-entendido"
                    id="botonEntendido">

                    Entendido

                </button>

            </aside>

        </div>

    </section>


    <script src="coregulacion.js"></script>

</body>

</html>
